# Centralized PostgreSQL server. No real credentials must be stored here.
app.database.kind=postgresql
app.sqlite.legacy-bootstrap=false
app.database.serialize-writers=false
# The PostgreSQL server is network-accessible: the backup API always requires a separate token.
backup.admin-token=${BACKUP_ADMIN_TOKEN:}
# For non-loopback PostgreSQL hosts, backup clients accept only verify-full.
# Configure the CA certificate as well, for example:
# backup.postgresql.sslmode=verify-full
# backup.postgresql.sslrootcert=C:/certificati/postgresql-root-ca.pem

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/employee_scheduling}
quarkus.datasource.username=${DATABASE_USERNAME:employee_scheduling}
quarkus.datasource.password=${DATABASE_PASSWORD:}
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.datasource.jdbc.min-size=${DATABASE_POOL_MIN_SIZE:2}
quarkus.datasource.jdbc.max-size=${DATABASE_POOL_MAX_SIZE:20}
# Use ISO-8601 in the default value: Quarkus also accepts "10S" at runtime, but VS Code
# extension validation uses java.time.Duration.parse and rejects it.
quarkus.datasource.jdbc.acquisition-timeout=${DATABASE_ACQUISITION_TIMEOUT:PT10S}
quarkus.datasource.jdbc.validation-query-sql=SELECT 1

quarkus.flyway.active=true
quarkus.flyway.locations=db/migration/postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.connect-retries=10
