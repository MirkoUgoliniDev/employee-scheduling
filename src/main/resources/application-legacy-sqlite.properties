# Historical SQLite database: retains the compatible bootstrap and does not automatically
# adopt the schema into Flyway. Use only for existing installations.
app.database.kind=sqlite
app.sqlite.legacy-bootstrap=true
app.database.serialize-writers=true

demo.db.name=${APP_DATABASE_PATH:databases/employee_scheduling.db}
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${demo.db.name}
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000
quarkus.datasource.jdbc.additional-jdbc-properties.foreign_keys=true
quarkus.datasource.jdbc.max-size=8
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

quarkus.flyway.active=false
quarkus.flyway.migrate-at-start=false
