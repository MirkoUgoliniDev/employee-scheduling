########################
# Packaging
########################
# The two test profiles live under src/main/resources on purpose: Quarkus does NOT apply
# application-<profile>.properties placed in src/test/resources — they are copied to
# target/test-classes and silently ignored, which shows up as the suite falling back to the
# default test port and to the wrong datasource. They must stay here to be read at all.
#
# Being here, though, they would be packaged and shipped: launching a released artifact with
# -Dquarkus.profile=test-sqlite would then hand /backup/* a token printed in a public
# repository and redirect the datasource to target/portability-sqlite.db. Dropping them from
# the built jar closes that without touching how tests resolve configuration.
# PackagedTestProfilesTest fails the build if a test profile is not listed here.
quarkus.package.jar.user-configured-ignored-entries=application-test-sqlite.properties,application-test-postgresql.properties

########################
# Timefold Solver properties
########################
# The solver runs for 30 seconds. Use "PT5M" for 5 minutes or "PT2H" for 2 hours.
# At runtime, every solve started from the UI overrides this limit with the structure's
# Solver Settings max_solve_seconds value (SolverConfigOverride). This remains the default
# for non-overridden solves and tests (%test below). Use ISO-8601 rather than "30s": both
# work at runtime, but VS Code extension validation uses java.time.Duration.parse and flags
# the short form.
quarkus.timefold.solver.termination.spent-limit=PT30S
# To change how many solvers to run in parallel
# timefold.solver-manager.parallel-solver-count=4
# Reproducible random seed: with a fixed seed, each solve produces the SAME solution for
# identical data (useful for debugging and A/B comparisons of settings). Enable it by adding,
# for example, TIMEFOLD_RANDOM_SEED=42 to the .env file (like QUARKUS_MAILER_* variables);
# empty or absent means normal random behavior. It is global for the application run and
# cannot be configured per organization.
quarkus.timefold.solver.random-seed=${TIMEFOLD_RANDOM_SEED:}
# Environment mode: since Timefold 1.20, the default includes score verification assertions
# (PHASE_ASSERT). Use NO_ASSERT for maximum speed on long solves; use FULL_ASSERT only when
# hunting bugs (it is very slow).
# quarkus.timefold.solver.environment-mode=NO_ASSERT
# quarkus.timefold.solver.environment-mode=FULL_ASSERT
# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/*soft
# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO
# XML file for power tweaking, defaults to solverConfig.xml (directly under src/main/resources)
# quarkus.timefold.solver-config-xml=org/.../maintenanceScheduleSolverConfig.xml
########################
# Timefold Solver Enterprise properties
########################
# To run increase CPU cores usage per solver
%enterprise.quarkus.timefold.solver.move-thread-count=AUTO
########################
# Native build properties
########################
# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true
########################
# Test overrides
########################
%test.quarkus.timefold.solver.termination.spent-limit=PT10S
demo.db.name=databases/employee_scheduling.db
# Backward-compatible default profile: desktop SQLite. Deployments must explicitly select
# sqlite/postgresql; application code remains shared.
app.database.kind=sqlite
app.sqlite.legacy-bootstrap=true
app.database.serialize-writers=true
########################
# Application authentication
########################
# Deny by default on ENDPOINTS, not paths. This distinction matters:
# - path-based protection would require listing dozens of scattered routes
#   (/getlocations, /addlocation, /editshift/{id}, etc.), and the first forgotten one would
#   silently remain open;
# - here every REST endpoint without a security annotation is DENIED, so a new unannotated
#   resource fails immediately instead of being exposed without protection.
# The static shell and SPA fallback are not JAX-RS endpoints and remain accessible so the
# login page can load.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# The primary identity source is the app_users table (JPA).
# users.properties / roles.properties are empty; they exist only to make the security
# properties (JAX-RS, form auth) available.
quarkus.security.users.file.enabled=false
# Form auth: the browser obtains a session cookie from POST /j_security_check.
# Empty login-page/error-page/landing-page values mean no redirects; the SPA handles outcomes
# by reading the HTTP status.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.timeout=PT8H
quarkus.http.auth.form.new-cookie-interval=PT30M
quarkus.http.auth.form.cookie-name=employee_scheduling_session
quarkus.http.auth.form.http-only-cookie=true
# This key encrypts the session cookie; changing it invalidates every session.
# Production must provide it through the environment; the default below is only for development,
# and SessionKeyGuard REFUSES TO START when it survives into a production launch — the literal
# ships with a public repository, so leaving it in place lets anyone forge an ADMIN cookie
# offline. Editing the default here means editing SessionKeyGuard.DEVELOPMENT_DEFAULT too;
# SessionKeyGuardTest fails the build if the two drift apart.
quarkus.http.auth.session.encryption-key=${AUTH_SESSION_KEY:dev-only-change-me-32-chars-min!!}

# SPA static resources are always public (otherwise JS/CSS requests could return 401).
quarkus.http.auth.permission.public.paths=/,/index.html,/assets/*,/assets/*/*,/assets/*/*/*,/favicon.ico
quarkus.http.auth.permission.public.methods=GET,HEAD,OPTIONS
quarkus.http.auth.permission.public.policy=permit
# No predefined administrator: the first public registration creates the initial active ADMIN.
# There is no default password.
#
# Registration modes:
#  - auto (default): derived from the database—sqlite = standalone, postgresql = server
#  - standalone: first user = ADMIN with username+password and NO email/OTP
#                (local desktop, no email server required); subsequent registrations are
#                closed (the ADMIN creates users through /users)
#  - server:     registration with email verification via OTP and ADMIN approval
app.registration.mode=${APP_REGISTRATION_MODE:auto}
# Optional sample business data for test installations. Disabled in production by default.
app.demo-data.enabled=${APP_DEMO_DATA:false}
# Automatically opens the browser when the desktop package (jpackage) starts.
# The browser is never touched in dev/test.
app.open-browser-on-start=${APP_OPEN_BROWSER_ON_START:true}
# Only one instance at a time (NORMAL/package mode only): a second instance shows a notice and
# exits. This can be disabled when multiple instances are genuinely required.
app.single-instance-lock=${APP_SINGLE_INSTANCE_LOCK:true}
########################
# ORM datasource (Agroal + Hibernate/Panache)—incremental migration, ORM branch
########################
# Same SQLite file as the legacy JDBC layer (demo.db.name): both layers coexist during the
# migration. The database is already in WAL mode (persistent journal_mode set by legacy init).
# SQLite JDBC properties apply busy_timeout and foreign keys to EVERY pooled connection; do not
# use one new-connection-sql for two PRAGMAs because sqlite-jdbc executes only the first statement.
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${demo.db.name}
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000
quarkus.datasource.jdbc.additional-jdbc-properties.foreign_keys=true
# Small pool: SQLite has ONE writer (WAL allows concurrent readers).
quarkus.datasource.jdbc.max-size=8
# NEVER generate/alter the schema from the model: the existing database is the source of truth.
# (No drop-and-create: this is a strict ORM migration rule.)
quarkus.hibernate-orm.schema-management.strategy=none
# Community SQLite dialect (from hibernate-community-dialects, version supplied by the BOM).
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
# Hibernate never updates the schema. Flyway is active only in explicit sqlite/postgresql
# profiles to avoid accidentally adopting a legacy database.
quarkus.flyway.active=false
quarkus.flyway.clean-disabled=true
quarkus.flyway.validate-migration-naming=true
quarkus.flyway.validate-on-migrate=true
# Automatic database backups: directory and retention. SQLite uses VACUUM INTO; PostgreSQL uses pg_dump.
# The interval is NOT configured here: the scheduler runs every 60 seconds and checks
# intervalMinutes, which the UI can change at runtime. backup.auto.every=30m used to be here,
# but nothing read it and it misled readers into believing otherwise, so it was removed.
backup.dir=databases/backups
backup.auto.keep=48
backup.other.keep=20
backup.auto.retention-days=30
backup.other.retention-days=90
backup.settings.file=databases/backup-settings.properties
# PostgreSQL backup. Client tools are not on PATH in Windows: they are searched under
# C:\Program Files\PostgreSQL\<major>\bin, selecting the highest major version. Uncomment only
# if they are elsewhere. The client major must be >= the server major; otherwise pg_dump refuses
# to start and backup is disabled with an explicit message.
#backup.postgresql.bin-dir=C:/Program Files/PostgreSQL/18/bin
backup.postgresql.timeout-seconds=600
backup.admin-token=${BACKUP_ADMIN_TOKEN:}
backup.admin.require-tls-for-remote=true
