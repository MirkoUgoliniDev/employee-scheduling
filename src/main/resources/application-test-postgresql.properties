app.database.kind=postgresql
app.sqlite.legacy-bootstrap=false
app.database.serialize-writers=false
backup.admin-token=test-backup-secret-0123456789abcdef
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/employee_scheduling_test}
quarkus.datasource.username=${TEST_DATABASE_USERNAME:employee_scheduling}
quarkus.datasource.password=${TEST_DATABASE_PASSWORD:employee_scheduling}
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.datasource.jdbc.max-size=12
quarkus.flyway.active=true
quarkus.flyway.locations=db/migration/postgresql
quarkus.flyway.migrate-at-start=true
quarkus.http.test-port=0
quarkus.scheduler.enabled=false
# Test backups must not be stored alongside real backups in databases/backups
backup.dir=target/postgresql-test-backups
backup.settings.file=target/postgresql-test-backup.properties
