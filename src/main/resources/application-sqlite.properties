# Local SQLite desktop profile for NEW databases managed by Flyway. The path can be outside
# the repository, for example %LOCALAPPDATA%/EmployeeScheduling/data/employee-scheduling.db.
# Use the legacy-sqlite profile for a historical database without flyway_schema_history.
app.database.kind=sqlite
app.sqlite.legacy-bootstrap=false
app.database.serialize-writers=true

demo.db.name=${APP_DATABASE_PATH:databases/large_data.db}
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${demo.db.name}
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000
quarkus.datasource.jdbc.additional-jdbc-properties.foreign_keys=true
quarkus.datasource.jdbc.max-size=8
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

quarkus.flyway.active=true
quarkus.flyway.locations=db/migration/sqlite
quarkus.flyway.migrate-at-start=true
# Deliberately false, as verified by PersistenceConfigurationTest. Pointing this profile at a
# historical database without flyway_schema_history makes Flyway fail with "Found non-empty
# schema(s) ... but no schema history table", which is the intended behavior. With
# baseline-on-migrate=true, the same database would be silently baselined at version 1 and later
# migrations would run on a schema that never received the earlier ones, causing delayed, silent
# corruption. The legacy-sqlite profile exists for historical databases and does not use Flyway.
quarkus.flyway.baseline-on-migrate=false
