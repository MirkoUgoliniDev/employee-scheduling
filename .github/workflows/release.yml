name: Publish release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build PostgreSQL and SQLite packages
        shell: bash
        run: |
          mkdir -p release
          mvn -B -ntp clean package -DskipTests \
            -Dquarkus.package.jar.type=uber-jar -Dquarkus.profile=postgresql
          cp target/*-runner.jar release/employee-scheduling-postgresql-runner.jar

          mvn -B -ntp clean package -DskipTests \
            -Dquarkus.package.jar.type=uber-jar -Dquarkus.profile=sqlite
          cp target/*-runner.jar release/employee-scheduling-sqlite-runner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*.jar
          if-no-files-found: error

  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Windows MSI
        shell: powershell
        run: .\scripts\install-windows.ps1 -Package msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi
          if-no-files-found: error

  publish-release:
    needs:
      - linux-packages
      - windows-msi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: release

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.jar *.msi > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --verify-tag
          --generate-notes
          --title "Employee Scheduling $GITHUB_REF_NAME"
