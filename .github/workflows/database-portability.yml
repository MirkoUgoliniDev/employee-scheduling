name: Database portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from lockfile
        run: npm ci
      - name: Lint frontend (zero warnings)
        run: npm run lint -- --max-warnings=0
      - name: Build frontend
        run: npm run build

  test-sqlite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, migrate, validate and test SQLite
        run: mvn -B -ntp clean verify "-Dquarkus.test.profile=test-sqlite"

  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: employee_scheduling_test
          POSTGRES_USER: employee_scheduling
          POSTGRES_PASSWORD: employee_scheduling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U employee_scheduling -d employee_scheduling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/employee_scheduling_test
      TEST_DATABASE_USERNAME: employee_scheduling
      TEST_DATABASE_PASSWORD: employee_scheduling
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 client tools
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, migrate, validate and test PostgreSQL
        run: mvn -B -ntp clean verify -Dquarkus.test.profile=test-postgresql
